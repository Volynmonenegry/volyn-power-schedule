name: Volyn Power Schedule

on:
  workflow_dispatch:
    inputs:
      args:
        description: 'Аргументи для main.py (напр.: --live-override --save-source-gpv)'
        required: false
        default: "--live-override --save-source-gpv --send"
  push:
    branches: [main]
  schedule:
    # Запуск рівно кожні 6 годин: 00:00, 06:00, 12:00, 18:00 (UTC)
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: volyn-power-schedule
  cancel-in-progress: false # Дозволяємо новому запуску чекати в черзі, якщо старий ще працює

jobs:
  update:
    runs-on: ubuntu-latest
    # Ставимо максимум 360 хвилин (6 годин), щоб GitHub не вбив нас раніше
    timeout-minutes: 360 

    env:
      TZ: Europe/Kyiv
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
      ARGS: ${{ github.event.inputs.args }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Запускаємо на 355 хвилин (5 годин 55 хвилин), щоб залишити 5 хвилин на збереження стану
            timeout 355m python -u main.py || true
          else
            echo "▶ python -u main.py $ARGS"
            eval "python -u main.py $ARGS"
          fi

      - name: Upload generated images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schedule-images
          path: "*.png"
          if-no-files-found: ignore

      - name: Commit updated state
        if: ${{ !contains(env.ARGS, '--debug') && !contains(env.ARGS, '--live-override') }}
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add state.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update schedule state [skip ci]"
            git pull --rebase origin main
            git push
          fi
