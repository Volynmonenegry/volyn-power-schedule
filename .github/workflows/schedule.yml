name: Volyn Power Schedule

on:
  workflow_dispatch:
    inputs:
      args:
        description: 'Аргументи для main.py (напр.: --live-override --save-source-gpv)'
        required: false
        default: "--live-override --save-source-gpv --send"
  push:
    branches: [main]
  schedule:
    - cron: "30 * * * *"

permissions:
  contents: write

concurrency:
  group: volyn-power-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55 # Збільшено з 5 хв, бо для schedule у вас стоїть timeout 50m

    env:
      TZ: Europe/Kyiv
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
      ARGS: ${{ github.event.inputs.args }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            timeout 50m python -u main.py || true
          else
            echo "▶ python -u main.py $ARGS"
            eval "python -u main.py $ARGS"
          fi

      - name: Upload generated images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schedule-images
          path: "*.png"
          if-no-files-found: ignore

      - name: Commit updated state
        if: ${{ !contains(env.ARGS, '--debug') && !contains(env.ARGS, '--live-override') }}
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore: update schedule state [skip ci]"
            git push
          fi
